- id: "qmul-artificial-intelligence"
  name: "MSc Artificial Intelligence"
  qualification: "MSc"
  study_mode:
    - "Full-time"
  delivery: "On campus"
  duration: "1 year"
  dates: "September 2027"
  deadline: ""
  summary: |
    This MSc allows you to focus your studies and combine different AI topics to suit your personal requirements and future plans. Our world-class teaching, research, and industrial contacts will support you as you learn to understand fundamental AI concepts. You will study universal machine learning tools essential for any AI job profile, as well as specific practical and research skills across various AI topics.
    
    You will gain experience with cutting-edge tools such as Deep Neural Networks (DNN), Deep Reinforcement Learning (Deep RL), and Large Language Models (LLMs) through regular exercises and practical labs. You will work closely with your lecturers and supervisors to carry out a major project on the AI topic you wish to specialise in.
  subjects:
    - "Artificial Intelligence"
    - "Machine Learning"
    - "Computer Science"
  highlights: []
  careers:
    - "Artificial Intelligence / Machine Learning"
    - "Data Science"
    - "Research Software Engineering"
    - "Software Engineering"
  entry_requirements: "UK students: 2:1 or above at undergraduate level in Electronic Engineering, Computer Science, Software Engineering, Information Technology, Mathematics or a related discipline. Applicants with a good 2:2 degree (55% or above) will be considered on an individual basis. International: varies by country of qualification - see QMUL Course finder for details."
  programme_url: "https://www.qmul.ac.uk/postgraduate/taught/coursefinder/courses/artificial-intelligence-msc/"
  department_url: "https://www.qmul.ac.uk/eecs/"

- id: "artificial-intelligence-and-machine-learning-in-science"
  name: "MSc Artificial Intelligence and Machine Learning in Science"
  qualification: "MSc"
  study_mode:
    - "Full-time"
  delivery: "On campus"
  duration: "1 year"
  dates: "September 2027"
  deadline: ""
  summary: |
    This cross-disciplinary masters programme will teach you the fundamentals of AI and Machine Learning, and how these can be applied to real-world scientific problems. It covers the fundamental concepts of Artificial Intelligence with a focus on the theoretical knowledge and practical skills required to apply machine learning techniques to a variety of scientific industries, research areas and real-world problems.

  subjects:
    - "Artificial Intelligence"
    - "Machine Learning"
    - "Data Science"
    - "Scientific Computing"
  highlights:
    - "Develop the coding and programming skills required to apply artificial intelligence to a wide range of fields."  
    - "Work with real datasets from our world-leading research with links to organisations such as CERN, NASA and LIGO."
    - "Study the essential mathematical concepts that underpin artificial intelligence and machine learning such as probability, statistics and time series."
    - "Learn from expert academics, including former industry practitioners, Fellows of the Alan Turing Institute and members of Queen Mary’s Digital Environment Research Institute (DERI)."
    - "No programming experience required."
  careers:
    - "Artificial Intelligence / Machine Learning"
    - "Data Science"
    - "Scientific Computing"
  entry_requirements: "UK students: a good 2:2 (55% or above) or above at undergraduate level in Mathematics, Physics, Chemistry, Computing, Engineering or any other STEM subject. International: varies by country of qualification - see QMUL Course finder for details."
  programme_url: "https://www.qmul.ac.uk/postgraduate/taught/coursefinder/courses/artificial-intelligence-and-machine-learning-in-science-msc/"
  department_url: "https://www.qmul.ac.uk/spcs/"

- id: "artificial-intelligence-for-drug-discovery"
  name: "MSc Artificial Intelligence for Drug Discovery"
  qualification: "MSc"
  study_mode:
    - "Full-time"
  delivery: "On campus"
  duration: "1 year"
  dates: "September 2027"
  deadline: ""
  summary: |
    The programme has been designed to prepare you for a career in computational drug discovery. 

    You'll developed advanced computational skills. We will teach you how to code in Python and how to implement and use machine and deep learning methods in the context of drug discovery, interpret their predictions and assess their quality. 

    You'll build a solid foundation in the essential concepts of drug discovery such as how to design a molecule to bind a target protein and how to optimise its chemical structure. 

    You'll have the opportunity to apply your computational skills to drug discovery as you study scientific computing and learn modelling and simulation techniques for biomolecular systems. 
  
  subjects:
    - "Artificial Intelligence"
    - "Machine Learning"
