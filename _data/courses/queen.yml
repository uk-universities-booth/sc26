    - "Computational Drug Discovery Scientist"
    - "Research Software Engineering"
    - "Academia / Research"
    - "PhD / Further Study"
  entry_requirements: "UK students: a good 2:2 (55% or above) or above at undergraduate level in Chemistry, Pharmaceutical Chemistry, Medicinal Chemistry, Biochemistry, Pharmacy, Biomedical Sciences or a related discipline. International: varies by country of qualification - see QMUL Course finder for details."
  programme_url: "https://www.qmul.ac.uk/postgraduate/taught/coursefinder/courses/artificial-intelligence-for-drug-discovery-msc/"
