- id: "artificial-intelligence-in-the-biosciences"
  name: "MSc Artificial Intelligence in the Biosciences"
  qualification: "MSc"
  study_mode:
    - "Full-time"
  delivery: "On campus"
  duration: "1 year"
  dates: "September 2027"
  deadline: ""
  summary: |
    This programme aims to prepare bioscience graduates to become leaders in the application of AI methods in professional bioscience Research and Development workplace environments. It has been specifically designed to make AI and related computational techniques (machine learning, analysis of large data sets) accessible to biology and biomedical graduate students without any prior experience in computational methods.
    
    This multifaceted programme builds the knowledge and skills needed to kick-start your career in professional bioscience research, consulting, and development. Teaching is jointly delivered by experts in the School of Biological and Behavioural Sciences and The School of Mathematical Sciences and will cover areas such as applications of AI and Data Science in Biology, Ecology, and Biomedicine, alongside technical skills such as coding, statistics, and the analysis of large datasets. You’ll also benefit from Queen Mary’s strong links to the AI sector, with the university being a member of the Alan Turing Institute and home to the Digital Environment Research Institute (DERI), one of the UK’s leading centres for AI research and innovation.

  subjects:
    - "Artificial Intelligence"
    - "Machine Learning"
    - "Data Science"
    - "Research Software Engineering"
    - "Cybersecurity"
  highlights: []
  careers:
    - "Research Software Engineering"
    - "Scientific Computing"
    - "Artificial Intelligence / Machine Learning"
    - "Data Science"
    - "Academia / Research"
    - "PhD / Further Study"
    - "Industry"
  entry_requirements: "UK students: a 2:1 or above at undergraduate level in a Science subject such as Biology, Chemistry, Mathematics or a related subject. Applicants with a good 2:2 degree (55% or above) will be considered on an individual basis. International: varies by country of qualification - see QMUL Course finder for details."
  programme_url: "https://www.qmul.ac.uk/postgraduate/taught/coursefinder/courses/artificial-intelligence-in-the-biosciences-msc/"
  department_url: "https://www.qmul.ac.uk/sbbs/"

