  summary: |
    Receive interdisciplinary training in AI, machine learning, deep learning, multivariate statistics, and chemometrics methods to analyse 'big data' from biomedical studies on this Master's course.
    Two research projects are major components of this course, and through these you will build your research experience in the development and application of these methods to real-world biomedical data.
    These will help you develop communication, presentation and grant-writing skills, and become familiar with critically evaluating cutting edge research papers.
