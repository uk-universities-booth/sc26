- id: "cancer-biology-cancer-informatics"
  name: "Cancer Biology (Cancer Informatics)"
  qualification: "MRes"
  study_mode: 
    - "Full-time"
  delivery: "On campus"
  duration: "1 year"
  dates: "October 2027 to October 2028"
  deadline: "6 January 2027"
  summary: |
    Receive the broad, interdisciplinary training needed to launch a research career in the fight against cancer with this Master's course. 
    You’ll receive a crash course in coding, transforming you from a life scientist to a confident informatician - or deepen your computational skills in a biological context.
    You'll explore cutting-edge developments in the field, including the use of AI and machine intelligence, and engage with some of the most advanced analytical tools in modern cancer research. 
    During your studies, you'll analyse the cellular and molecular basis of cancer biology and be introduced to the clinical and pathological aspects of carcinogenesis.  
    A series of workshops will help you develop key transferable skills for a research career, such as the oral presentation of scientific data and grant writing. 
    You'll also gain insights into the excellent project opportunities at Imperial and partner institutions including the Crick Institute and Institute of Cancer Research. 
    Immerse yourself in a multidisciplinary research environment on a 10-month focused research project in world leading labs. 
  
  subjects: 
    - "Machine Learning"
    - "Data Science"
    - "Scientific Computing"
    - "Computational Modelling"
  highlights: 
    - "Innovative 10-month research project with external collaboration available."
    - "Opportunities for PhD progression"
    - "Access to HPC facilities"
  careers: 
    - "HPC / Supercomputing"
    - "Artificial Intelligence / Machine Learning"
    - "Data Science"
    - "Scientific Computing"
    - "Academia / Research"
    - "PhD / Further Study"
    - "Industry"
  entry_requirements: "2:1 in an appropriate subject."
  programme_url: "https://www.imperial.ac.uk/study/courses/postgraduate-taught/cancer-informatics/"
  department_url: "https://www.imperial.ac.uk/department-surgery-cancer/"


- id: "cancer-biology-cancer-innovation"
  name: "Cancer Biology (Cancer Innovation)"
  qualification: "MRes"
  study_mode: 
    - "Full-time"
  delivery: "On campus"
  duration: "1 year"
  dates: "October 2027 to October 2028"
  deadline: "6 January 2027"
  summary: |
    Develop skills across disciplines to further your proficiency of experimental and computational research, and push forward research in cancer biology.
    In this Cancer Innovation stream, you will focus on the development of novel, innovative approaches to biological and medical problems in cancer. Blended learning with demonstrations and workshops will train you in the translation of biotechnology platforms, from concept to realisation and onward to application in the clinical/commercial environment.
    You will learn the skills to critically analyse current literature and performance data. Beyond this, you’ll be trained to communicate technological concepts to both scientific and commercial audiences, as well as to patients themselves.
    This research-oriented course offers students the opportunity to conduct an innovative 10-month research project. These can be wet-lab/dry lab projects or original research and analysis.
    You will be trained in the cellular and molecular basis of cancer biology, as well as receiving an introduction to the clinical and pathological aspects of carcinogenesis and treatment. 
    On completing this course, you will be ready to continue a career in ground-breaking research or pursue varied career paths where an advanced knowledge and understanding of cancer research is highly sought after.
  
  
  subjects: 
    - "High-Performance Computing (HPC)"
    - "Machine Learning"
    - "Data Science"
    - "Scientific Computing"
    - "Computational Science"
    - "Computational Modelling"
  highlights: 
