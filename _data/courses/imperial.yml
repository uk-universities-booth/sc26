    - "Innovative 10-month research project"
    - "Strong links to relevant industry and research institutes"
  careers: 
    - "Artificial Intelligence / Machine Learning"
    - "Data Science"
    - "Scientific Computing"
    - "Academia / Research"
    - "PhD / Further Study"
    - "Industry"
  entry_requirements: "2:1 in Science, Engineering, Biomedical Science or Medicine."
  programme_url: "https://www.imperial.ac.uk/study/courses/postgraduate-taught/cancer-innovation/"
  department_url: "https://www.imperial.ac.uk/department-surgery-cancer/"



- id: "msc-computational-biomedicine-computational-brain-sciences-online"
  name: "MSc Computational Biomedicine (Computational Brain Sciences) (Online)"
  qualification: "MSc"
  study_mode: 
    - "Part-time"
  delivery: "Online"
  duration: "28 months"
  dates: "October 2027 to February 2030"
  deadline: "6 January 2027"
  summary: |
    Study remotely at one of the top STEM universities in the world, using innovative virtual learning environments and VR technologies.
    You will take core modules in computational biology related data science and biostatistics and then complete two modules in the computational brain science stream, together with a six-month computational research project that provides research experience in computational biomedicine. This course also has strong components in applied artificial intelligence (machine and deep learning) and biomedical data science.
    This newly developed curriculum brings together training in the latest advances in computational brain sciences and is delivered flexibly to suit all learners. 
    Alongside accessible and engaging lecture and training material, this course also uses novel synchronous sessions delivered via online streaming and virtual reality (VR) technologies. This will promote interactions in virtual spaces between lecturers and students and provides unique learning opportunities.
    This course will develop your expertise in programming, biostatistics, AI and data science, and provide specialist skills in computational brain science to enhance your research portfolio and employability prospects.
  subjects: 
    - "Artificial Intelligence"
    - "Machine Learning"
    - "Data Science"
    - "Scientific Computing"
    - "Computational Science"
  highlights: 
    - "Access to HPC facilities"
    - "Opportunities for PhD progression"
    - "Diverse teaching and learning methods"
  careers: 
    - "Data Science"
    - "Scientific Computing"
    - "Computational Science"
    - "Academia / Research"
    - "PhD / Further Study"
    - "Industry"
  entry_requirements: "2:1 in a relevant Biological or Biomedical Science discipline or in Clinical Medicine."
  programme_url: "https://www.imperial.ac.uk/study/courses/postgraduate-taught/computational-biomedicine-brain-sciences/"
  department_url: "https://www.imperial.ac.uk/brain-sciences/"


- id: "health-data-analytics-and-machine-learning"
  name: "Health Data Analytics and Machine Learning"
  qualification: "MSc"
  study_mode: 
    - "Full-time"
  delivery: "On campus"
