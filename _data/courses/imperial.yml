- id: "artificial-intelligence-applications-and-innovation"
  name: "Artificial Intelligence Applications and Innovation"
  qualification: "MSc"
  study_mode: 
    - "Full-time"
  delivery: "On campus"
  duration: "1 year"
  dates: "October 2027 - October 2028"
  deadline: "6 January 2027"
  summary: |
    Enhance your understanding of AI fundamentals, cultivate hands-on skills in AI technologies, delve into diverse AI applications and AI-driven business innovation.
    Whether you have a background in engineering, mathematics, computer science, business or a deep interest in applying AI in industry, this course will help develop your knowledge and skills to revolutionise how we work, live, and innovate using AI, such as for industries in healthcare, finance, and robotics.
    You will study the core of AI and machine learning, and explore the intricate world of deep learning. You will also work on a Group Project on AI Ventures and Ethics, where you will not only develop AI technologies but also craft business strategies.
