- id: "ecology-evolution-and-conservation-mres"
  name: "Ecology, Evolution and Conservation MRes"
  qualification: "MRes"
  study_mode: 
    - "Full-time"
    - "Part-time"
  delivery: "On campus"
  duration: "1 year, 2 years"
  dates: "October 2027 to October 2028, or October 2027 to October 2029"
  deadline: "6 January 2027"
  summary: |
    Gain broad, interdisciplinary training in ecology, evolution and conservation on this Master's programme.
    Available full-time or part-time, the course is taught by internationally recognised researchers who will give you first-hand experience of conducting high-quality scientific research.
    You'll gain a strong foundation in R, statistics, and the analysis of ecological and evolutionary data, alongside practical fieldwork in the temperate forests and grasslands of Imperial's Silwood Park Campus. 
    An independent research project allows you to apply your skills to a real scientific question. Projects can address fundamental or applied topics, including practical conservation challenges, and may be carried out with our own researchers or with external collaborators including Zoological Society of London (ZSL). 
    By combining rigorous scientific training with interdisciplinary perspectives and international collaborations, you'll graduate with the skills to tackle some of the world's most pressing environmental challenges.

